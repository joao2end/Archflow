<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArchFlow Logic · vídeo de 30 s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400..800&display=swap" rel="stylesheet">
<style>
/* ===== tokens (os mesmos do app: src/styles.css) ===== */
:root{
  --secondary:#f7f1e3;
  --ink:#25244a; --ink-2:#5a5883; --ink-3:#666490;
  --primary:#706fd3; --primary-600:#5a59c4; --primary-100:rgba(112,111,211,.12);
  --glass-bg:rgba(255,255,255,.52); --glass-border:rgba(255,255,255,.78);
  --hairline:rgba(112,111,211,.16);
  --shadow:0 18px 50px -12px rgba(75,73,168,.28);
  --node-fill:rgba(255,255,255,.74); --sheen:#fff; --sheen-a:.75; --sheen-b:.05;
  --s-solid:#fff; --s-strong:rgba(255,255,255,.78);
  --ok:#14a38b; --danger:#c9302c;
  --halo-1:rgba(112,111,211,.34); --halo-2:rgba(255,178,140,.34); --halo-3:rgba(120,200,190,.24);
  --line-white:#ffffff; --chip-mix:#000; --letterbox:#e6dfcc;
  --c-start:#3aa76d; --c-end:#8a6fd0; --c-rule:#706fd3; --c-if:#0e9aa7; --c-loop:#c2548b;
  --c-fork:#e0a526; --c-call:#6c7a89; --c-data:#7fb3d5; --c-case:#4caf7d;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Inter Tight",system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace;
}
:root[data-theme="dark"]{
  --secondary:#2d2a2e;
  --ink:#fcfcfa; --ink-2:#c9c8c4; --ink-3:#a5a4a1;
  --primary:#ab9df2; --primary-600:#9486e0; --primary-100:rgba(171,157,242,.18);
  --glass-bg:rgba(255,255,255,.07); --glass-border:rgba(255,255,255,.16);
  --hairline:rgba(171,157,242,.22);
  --shadow:0 18px 50px -12px rgba(0,0,0,.55);
  --node-fill:rgba(64,62,65,.96); --sheen:#fcfcfa; --sheen-a:.05; --sheen-b:0;
  --s-solid:#403e41; --s-strong:rgba(64,62,65,.85);
  --ok:#a9dc76; --danger:#ffa8be;
  --halo-1:rgba(171,157,242,.22); --halo-2:rgba(255,160,130,.14); --halo-3:rgba(120,220,232,.12);
  --line-white:rgba(255,255,255,.9); --chip-mix:#fff; --letterbox:#1d1b1e;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--letterbox)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--secondary);color:var(--ink);font-family:var(--sans)}
#stage section{position:absolute;inset:0;pointer-events:none}
.halo{position:absolute;border-radius:50%;will-change:transform}
svg.ovl{position:absolute;left:0;top:0;overflow:visible}
.tl{position:absolute;white-space:nowrap;font-family:var(--serif);font-weight:400;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.tl em{font-style:italic;color:var(--primary)}
.lockup{position:absolute;white-space:nowrap;font-family:var(--sans);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.lockup span{font-family:var(--serif);font-weight:400;font-style:italic;color:var(--primary);letter-spacing:0}
.support{position:absolute;font:500 36px/1.25 var(--sans);color:var(--ink-2);text-align:center}
.support b{white-space:nowrap;font-weight:700;color:var(--ink);font-family:var(--mono);font-size:.9em}
.v .support{font-size:44px}

/* ===== componentes Logic (cópia de .node.logic em src/styles.css) ===== */
svg .nb{fill:var(--node-fill);stroke:var(--hairline);stroke-width:1.2}
svg .wash{opacity:.07}
svg .ring{fill:none;stroke:rgba(112,111,211,.22);stroke-width:1}
svg .cap{font:800 9.5px var(--sans);letter-spacing:.1em}
svg .t{font:650 13px var(--sans);fill:var(--ink);letter-spacing:-.005em}
svg .ln{font:500 12px var(--sans);fill:var(--ink-2)}
svg .ln.c{fill:var(--ink);font-weight:650}
svg .mn{font:500 10.5px var(--mono);fill:var(--ink-3)}
svg .sec{font:800 9px var(--sans);letter-spacing:.08em}
svg .rl{stroke:var(--hairline);stroke-width:1}
svg .bar{font:800 9.5px var(--sans);letter-spacing:.16em;fill:#fff}
svg .chip rect{fill:none;stroke:var(--hairline);stroke-width:1}
svg .chip text{font:600 10.5px var(--sans);fill:var(--ink-2)}
svg .chip.w rect{fill:var(--primary-100);stroke:color-mix(in srgb,var(--primary) 40%,transparent)}
svg .chip.w text{fill:var(--ink)}
svg .lab rect{fill:var(--s-strong)}
svg .lab text{font:650 11.5px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
svg .badge{font:700 22px var(--sans);letter-spacing:.06em}
svg .seal circle{filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
svg .seal path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg .edge{fill:none;stroke-linecap:round}
svg .head{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ===== painel de reprodução (cópia de .logic-play-panel) ===== */
.glass{position:absolute;background:var(--glass-bg);border:1.5px solid var(--glass-border);outline:1px solid var(--hairline);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);border-radius:20px}
#panel{transform-origin:0 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lp-head{display:flex;align-items:center;gap:10px}
.lp-title{font:650 13.5px var(--sans);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-title small{font-weight:500;color:var(--ink-2);margin-left:6px}
.lp-ctl{display:inline-flex;gap:4px}
.btn{min-width:32px;height:30px;padding:0 8px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font:600 12px var(--sans);color:var(--ink);border:1px solid var(--hairline);background:var(--s-strong)}
.btn.primary{background:var(--primary-600);color:#fff;border-color:transparent}
.lp-bar{height:4px;border-radius:4px;background:var(--hairline);overflow:hidden}
.lp-bar>i{display:block;height:100%;background:var(--primary-600);width:0}
.lp-main{display:flex;gap:18px;align-items:center}
.lp-now{flex:1;min-width:0;font:500 12.5px var(--sans);color:var(--ink);line-height:1.45;display:flex;flex-direction:column;gap:2px}
.lp-now b{font-weight:700}
.stk{display:grid;overflow:hidden}
.stk>*{grid-area:1/1;white-space:nowrap}
.lp-chg{display:inline-block;margin:2px 6px 0 0;padding:1px 8px;border-radius:999px;background:rgba(127,179,213,.16);font:600 11.5px var(--sans)}
.lp-verdict{font:650 12.5px var(--sans);min-height:18px}
.lp-verdict.ok{color:#2f9e6b}.lp-verdict.fail{color:#d6453d}
.lp-val{display:flex;align-items:center;gap:12px}
.lp-val label{font:500 13px var(--mono);color:var(--ink-3)}
.odo{display:inline-flex;align-items:flex-start;font:700 38px/1.05 var(--sans);font-feature-settings:"tnum";color:var(--ink);letter-spacing:-.01em}
.odo .cur{font-size:.42em;align-self:center;margin-right:.3em;color:var(--ink-2);letter-spacing:.06em}
.odo .dg{display:inline-block;overflow:hidden;height:1.05em;width:.6em;vertical-align:top}
.odo .dg .st{display:block}
.odo .dg i{display:block;height:1.05em;line-height:1.05em;font-style:normal;text-align:center}
.odo .cm{width:.28em;text-align:center}
.v .lp-head,.v .lp-now .tx,.v .lp-verdict-row{display:none}
.v #panel{gap:4px;padding:8px 14px}
.v .lp-main{flex-direction:column;align-items:stretch;gap:2px}
.v .lp-val{order:-1;justify-content:space-between}
.v .odo{font-size:44px}
.tok{position:absolute;display:none;font:700 26px/1 var(--mono);padding:10px 16px;border-radius:14px;border:2px solid var(--c);
  background:color-mix(in srgb,var(--c) 22%,var(--glass-bg));backdrop-filter:blur(10px);color:var(--ink);box-shadow:var(--shadow)}
.v .tok{font-size:32px}

#fmt{position:fixed;right:14px;bottom:14px;z-index:10;font:600 13px/1 var(--sans);letter-spacing:.04em;padding:9px 13px;border-radius:999px;
  border:1px solid rgba(37,36,74,.25);background:rgba(255,255,255,.7);color:#25244a;cursor:pointer;opacity:.35;transition:opacity .2s}
#fmt:hover,#fmt:focus-visible{opacity:1}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Vídeo de 30 segundos: uma regra de negócio do ArchFlow, modo Logic, que se confere sozinha.">
  <div id="bg" aria-hidden="true"><div class="halo"></div><div class="halo"></div><div class="halo"></div></div>
  <svg class="ovl" id="svg" aria-hidden="true">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.14"/>
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.1"/>
      </filter>
      <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sheen);stop-opacity:var(--sheen-a)"/>
        <stop offset="0.5" style="stop-color:var(--sheen);stop-opacity:var(--sheen-b)"/>
      </linearGradient>
    </defs>
    <g id="cam"><g id="lead"></g><g id="world"><g id="ghosts"></g><g id="edges"></g><g id="nodes"></g><g id="labels"></g></g></g>
    <g id="pal"></g>
  </svg>
  <section id="sc-hook" aria-label="Abertura: uma linha fina vira o fluxo e o título Regra de negócio que se confere sozinha aparece"></section>
  <section id="sc-flow" aria-label="Fluxo Logic: Início, Decisão, Regra e Fim executam o cálculo do preço mínimo, com os dados de custo e margem e o painel de reprodução"></section>
  <section id="sc-check" aria-label="Verificação: o valor do fluxo e o esperado se encontram, o cenário confere, e a variação com 11,00 mostra o X de divergência"></section>
  <section id="sc-cta" aria-label="Fechamento: paleta de papéis do Logic, frase Escreva a regra, o quadro prova, e lockup ArchFlow modo Logic"></section>
  <svg class="ovl" id="fx" aria-hidden="true">
    <defs><radialGradient id="spotG"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="var(--ok)" stop-opacity=".75"/><stop offset="1" stop-color="var(--ok)" stop-opacity="0"/></radialGradient></defs>
    <circle id="burst" fill="none" stroke="var(--ok)"/>
    <circle id="spot" r="84" fill="url(#spotG)"/>
  </svg>
</div>
<button id="fmt" type="button" aria-label="Alternar formato horizontal e vertical">⇄ formato</button>

<script>
(() => {
const T = 30;
const qs = new URLSearchParams(location.search);
if (qs.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

/* ===== funções puras de tempo ===== */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (u, a, b) => clamp((u * T - a) / (b - a));          // u = t normalizado 0..1; a,b em segundos
const bezier = (x1, y1, x2, y2) => x => {
  if (x <= 0) return 0; if (x >= 1) return 1;
  let lo = 0, hi = 1, m = .5;
  for (let i = 0; i < 28; i++) { m = (lo + hi) / 2; const cx = 3*(1-m)*(1-m)*m*x1 + 3*(1-m)*m*m*x2 + m*m*m; cx < x ? lo = m : hi = m; }
  return 3*(1-m)*(1-m)*m*y1 + 3*(1-m)*m*m*y2 + m*m*m;
};
const ease = bezier(.65, 0, .35, 1);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);

/* ===== componentes do ArchFlow (espelham LogicShape em src/ui/Canvas.tsx) ===== */
const ROLE = { // src/shared/schema.ts · LOGIC_ROLES
  start: ['#3aa76d', 'START'], end: ['#8a6fd0', 'END'], rule: ['#706fd3', 'RULE'], decision: ['#0e9aa7', 'IF'],
  switch: ['#0e9aa7', 'CASE?'], loop: ['#c2548b', 'LOOP'], fork: ['#e0a526', 'FORK'], join: ['#e0a526', 'JOIN'],
  call: ['#6c7a89', 'CALL'], fact: ['#7fb3d5', 'DATA'], scenario: ['#4caf7d', 'CASE'],
};
const ICON = { // src/shared/logiccard.ts · LOGIC_ICON
  start: ['M8 5.5v13L19 12z'], end: ['M5 12.5l4.5 4.5L19 7.5'],
  rule: ['M13 2.5L5 13.5h6l-1 8 8-11h-6z'], decision: ['M9.2 9a3 3 0 1 1 4.4 2.6c-1 .6-1.6 1.1-1.6 2.4', 'M12 17.8h.01'],
  switch: ['M12 3.5v6', 'M12 9.5L6 15.5', 'M12 9.5l6 6', 'M6 15.5v5', 'M18 15.5v5'],
  loop: ['M17 3l3.5 3.5L17 10', 'M3.5 12v-1.5a4 4 0 0 1 4-4H20.5', 'M7 21l-3.5-3.5L7 14', 'M20.5 12v1.5a4 4 0 0 1-4 4H3.5'],
  call: ['M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1', 'M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'],
};
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ico = (paths, x, y, size, color, round) => {
  const s = size * .54 / 24, off = (size - 24 * s) / 2, r = round ? size / 2 : size * .3;
  return `<g transform="translate(${x},${y})"><rect width="${size}" height="${size}" rx="${r}" fill="${color}"/><rect width="${size}" height="${size / 2}" rx="${r}" fill="#fff" opacity=".14"/><g transform="translate(${off},${off}) scale(${s})" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${paths.map(d => `<path d="${d}"/>`).join('')}</g></g>`;
};
const capT = (c, x, y, text) => `<text class="cap" x="${x}" y="${y}" fill="${c}">${text}</text>`;
const nodeFrame = (w, h, R, color, dashed, inner) =>
  `<rect class="nb" width="${w}" height="${h}" rx="${R}" filter="url(#shadow)"/><rect class="wash" width="${w}" height="${h}" rx="${R}" fill="${color}"/>` +
  `<rect width="${w}" height="${h}" rx="${R}" fill="url(#sheen)"/><rect class="ring" width="${w}" height="${h}" rx="${R}"${dashed ? ' stroke-dasharray="6 5"' : ''}/>${inner}`;
const SEAL_OK = 'M-4,0.5 L-1,3.5 L4.5,-3', SEAL_X1 = 'M-3.5,-3.5 L3.5,3.5', SEAL_X2 = 'M3.5,-3.5 L-3.5,3.5';
const sealG = (x, y, ok) => `<g class="seal" transform="translate(${x},${y})"><circle r="9" fill="${ok ? '#2f9e6b' : '#d6453d'}"/><path d="${ok ? SEAL_OK : SEAL_X1 + ' ' + SEAL_X2}"/></g>`;

// cada construtor devolve {w,h,R,color,dashed,inner}
const B = {
  capsule(kind, cap, title) {                                  // início / fim
    const [c] = ROLE[kind], w = 280, h = 60;
    return { w, h, R: h / 2, color: c, inner: ico(ICON[kind], 10, h / 2 - 18, 36, c, true) + capT(c, 58, h / 2 - 5, cap) + `<text class="t" x="58" y="${h / 2 + 13}">${title}</text>` };
  },
  card(role, cap, title, body, w = 330, dashed = false, seal = '') {   // decisão, escolha, laço, chamada
    const [c] = ROLE[role], h = 58 + title.length * 15 + body.length * 14;
    return { w, h, R: 16, color: c, dashed, inner: ico(ICON[role], 12, 12, 32, c) + capT(c, 54, 22, cap) +
      title.map((t, k) => `<text class="t" x="54" y="${39 + k * 15}">${t}</text>`).join('') +
      body.map((t, k) => `<text class="ln" x="54" y="${39 + title.length * 15 + 4 + k * 14}">${t}</text>`).join('') + seal };
  },
  rule(title, lines, chips, w = 330) {                         // regra: cartão de ação
    const [c] = ROLE.rule, secs = [];
    let y = 54, inner = ico(ICON.rule, 12, 11, 32, c) + capT(c, 54, 23, 'REGRA') + `<text class="t" style="font-size:13.5px" x="54" y="40">${title}</text>`;
    const pill = (label, top) => `<g><rect x="12" y="${top + 1}" width="${label.length * 6.6 + 14}" height="17" rx="8.5" fill="${c}" opacity=".13"/><text class="sec" x="${12 + (label.length * 6.6 + 14) / 2}" y="${top + 13}" text-anchor="middle" fill="${c}">${label}</text></g>`;
    if (lines.length) { const top = y; inner += `<line class="rl" x1="14" x2="${w - 14}" y1="${top - 6}" y2="${top - 6}"/>${pill('ENTÃO', top)}` + lines.map((t, k) => `<text class="ln" x="76" y="${top + 13 + k * 15}">${t}</text>`).join(''); y += lines.length * 15 + 14; }
    if (chips.length) {
      const top = y; inner += `<line class="rl" x1="14" x2="${w - 14}" y1="${top - 6}" y2="${top - 6}"/>${pill('DADOS', top)}`;
      let x = 0; chips.forEach(([text, write]) => { const cw = Math.round(text.length * 6.3 + 20); inner += `<g class="chip${write ? ' w' : ''}" transform="translate(${76 + x},${top})"><rect width="${cw}" height="19" rx="9.5"/><text x="${cw / 2}" y="13" text-anchor="middle">${text}</text></g>`; x += cw + 6; });
      y += 34;
    }
    return { w, h: y + 4, R: 16, color: c, inner };
  },
  bar(role, label) { const [c] = ROLE[role]; return { w: 280, h: 26, R: 13, color: c, bar: true, inner: `<rect width="280" height="26" rx="13" fill="${c}" opacity=".88"/><text class="bar" x="140" y="16.6" text-anchor="middle">${label}</text>` }; },
  fact(title, key) {
    const [c] = ROLE.fact;
    return { w: 250, h: 46, R: 14, color: c, inner: `<circle cx="18" cy="23" r="5.5" fill="${c}"/><text class="t" style="font-size:12.5px" x="32" y="20">${title}</text><text class="mn" x="32" y="35">${key}</text>` };
  },
  scenario(title, seal) {
    const [c] = ROLE.scenario, h = 40 + title.length * 15;
    return { w: 320, h, R: 16, color: c, inner: `<g><circle cx="30" cy="${h / 2}" r="18" fill="${c}" style="filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))"/><path d="M25,${h / 2 - 8} L37,${h / 2} L25,${h / 2 + 8} Z" fill="#fff"/></g>` + capT(c, 58, 20, 'CENÁRIO') +
      title.map((t, k) => `<text class="t" style="font-size:12.5px" x="58" y="${37 + k * 15}">${t}</text>`).join('') + seal };
  },
};
const mkNode = (spec, parent) => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = spec.bar ? `<g>${spec.inner}</g>` + `<rect class="ring" width="${spec.w}" height="${spec.h}" rx="${spec.R}"/>` : nodeFrame(spec.w, spec.h, spec.R, spec.color, spec.dashed, spec.inner);
  parent.appendChild(g); return g;
};

/* nós do exemplo: preço com margem mínima */
const FLOW = [
  { id: 'start', spec: () => B.capsule('start', 'INÍCIO', 'Calcular preço'), born: [1.8, 3.0] },
  { id: 'if', spec: () => B.card('decision', 'DECISÃO', ['Abaixo do piso?'], ['Preço 9,50 menor que o piso 10,67?']), born: [7.0, 7.9] },
  { id: 'rule', spec: () => B.rule('Subir ao piso', ['preço passa a ser o piso'], [['piso', false], ['preço', true]]), born: [10.0, 10.9] },
  { id: 'end', spec: () => B.capsule('end', 'FIM', 'Preço final'), born: [13.6, 14.4] },
  { id: 'case', spec: () => B.scenario(['Preço abaixo do piso', 'sobe a 10,67'], `<g class="seal" id="cseal" transform="translate(298,20)"><circle id="cs-c" r="9" fill="#2f9e6b"/><path id="cs-ok" d="${SEAL_OK}"/><path id="cs-x1" d="${SEAL_X1}"/><path id="cs-x2" d="${SEAL_X2}"/></g>`), born: [15.4, 16.3] },
];
const FACTS = [['Custo', 'custo = 8,00'], ['Margem mínima', 'margem_minima = 25%'], ['Piso', 'piso = 10,67']];

/* ===== layout(format): única fonte de posições (coordenadas do mundo) ===== */
function layout(f) {
  const v = f === 'v';
  const at = (id, spec) => spec;
  const sp = Object.fromEntries(FLOW.map(n => [n.id, null]));
  const L = {
    f, v, W: v ? 1080 : 1920, H: v ? 1920 : 1080,
    anchor: v ? [540, 740] : [960, 470],
    pos: v ? { start: [-140, 0], if: [-165, 110], rule: [-165, 261], end: [-140, 432], case: [-160, 542] }
           : { start: [0, -30], if: [370, -43.5], rule: [790, -60.5], end: [1210, -30], case: [1580, -35] },
    factPos: v ? FACTS.map((_, i) => [-125, -192 + i * 58]) : FACTS.map((_, i) => [420 + i * 266, -172]),
    factFrom: v ? [380, 0] : [900, 0],
