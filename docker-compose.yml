services:
  archflow:
    build: .
    restart: unless-stopped
    expose:
      - "7077"
    environment:
      ARCHFLOW_PUBLIC: "1" # só estático: cada visitante usa o cofre do próprio navegador
      ARCHFLOW_ALLOWED_HOSTS: archflow.2end.online,archflow.2-end.online
    volumes:
      - archflow-data:/data
    labels:
      # Router próprio (prioridade maior); reutiliza o serviço gerado pelo Dokploy. Sem auth: no modo público o servidor não guarda dados
      - "traefik.http.routers.archflow-secure.rule=Host(`archflow.2end.online`) || Host(`archflow.2-end.online`)"
      - "traefik.http.routers.archflow-secure.entrypoints=websecure"
      - "traefik.http.routers.archflow-secure.priority=100"
      - "traefik.http.routers.archflow-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.archflow-secure.service=archflow-mrehah-41-websecure"

volumes:
  archflow-data:
