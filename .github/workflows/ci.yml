name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # o node-pty não traz binário para linux-x64: compila aqui (os testes do terminal precisam dele)
      - run: npm rebuild node-pty
      - run: npm run typecheck
      - run: npm test
      - run: npm run examples:build -- --check
      - run: npx vite build --configLoader runner
